name: 页面或功能问题
description: 报告可以稳定复现的页面、链接或交互问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿在公开 Issue 中填写学生个人信息、密码、令牌或其他敏感内容。
  - type: input
    id: page
    attributes:
      label: 受影响页面
      description: 请填写公开网址或仓库内的相对路径。
      placeholder: gallery/index.html
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期待什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      placeholder: Windows 11 / Chrome
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有提交密码、令牌、学生联系方式或其他敏感信息。
          required: true


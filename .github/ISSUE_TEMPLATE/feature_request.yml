name: 功能或改进建议
description: 提出与学习体验、可访问性或维护流程有关的建议
title: "[Idea] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请先说明真实使用场景和当前困难，而不是只描述想增加的功能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明最小可行改进及如何判断它有效。
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: 主要使用者
      options:
        - 学生
        - 家长
        - 教师或活动组织者
        - 项目维护者
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 内容边界
      options:
        - label: 该建议不要求公开学生个人信息或未经授权的第三方素材。
          required: true


<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="岭南数字论坛筹备试用版：一份活动资料，同步预览海报、现场投影和主持稿。"><title>岭南数字论坛 · 筹备工作台</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="mark">岭</span><div><strong>岭南数字论坛</strong><span>活动筹备工作台</span></div></div><div class="top-actions"><span class="badge">试用版 · 本机保存</span><button id="exportData">导出资料包</button><label class="button">导入资料包<input id="importData" type="file" accept="application/json,.json" hidden></label></div></header>
<div class="notice">你的修改仅保存在当前浏览器，不会同步给其他人。交接请导出资料包；本页未接入账号、在线协作或审核。</div>
<main class="workspace">
<aside class="editor"><div class="event-picker"><label for="eventPicker">当前活动</label><select id="eventPicker"></select><button id="duplicate">复制为新一期</button></div><div class="section-nav" id="sections" aria-label="资料分类"></div><div id="form"></div><div class="savebar"><span id="saveStatus" role="status">正在加载</span><button id="snapshot">留存版本</button></div><details class="history"><summary>本机历史版本</summary><div id="history"></div></details></aside>
<section class="preview-area"><div class="preview-heading"><div><span class="eyebrow">活动资料 → 三份成品</span><h1 id="eventHeading">走进金域医学</h1></div><button id="checksToggle">查看待核对项 <span id="checkCount"></span></button></div><div id="checks" class="checks" hidden></div>
<div class="preview-toolbar"><div class="tabs" role="tablist" aria-label="成品预览"><button data-view="poster" role="tab" aria-selected="true">长海报</button><button data-view="slides" role="tab" aria-selected="false">现场投影</button><button data-view="script" role="tab" aria-selected="false">主持稿</button></div><div id="outputActions"></div></div>
<div id="preview" class="preview" aria-live="polite"></div><div id="slideNav" hidden><button id="prevSlide">← 上一页</button><span id="slideNumber"></span><button id="nextSlide">下一页 →</button></div>
<p class="preview-note" id="previewNote"></p></section></main>
<div id="toast" role="status" class="toast" hidden></div><script type="module" src="app.js"></script>
</body></html>

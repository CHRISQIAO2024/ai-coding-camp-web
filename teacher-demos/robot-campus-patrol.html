<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可爱机器人校园巡逻</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            overflow: hidden;
            background-color: #e0f7fa;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* UI 界面层 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        /* 控制按钮区域 */
        .controls {
            pointer-events: auto;
            display: flex;
            gap: 12px;
            justify-content: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            backdrop-filter: blur(8px);
            align-self: center;
            margin-bottom: 20px;
        }
        .btn {
            background: #ff7043;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(255, 112, 67, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 15px rgba(255, 112, 67, 0.4);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-secondary {
            background: #42a5f5;
            box-shadow: 0 4px 10px rgba(66, 165, 245, 0.3);
        }
        .btn-secondary:hover {
            box-shadow: 0 6px 15px rgba(66, 165, 245, 0.4);
        }
        /* 巡逻完成提示框 */
        #completion-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #completion-card.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        #completion-card h1 {
            color: #2e7d32;
            font-size: 32px;
            margin-bottom: 10px;
        }
        #completion-card p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
    <!-- 引入 Three.js 与 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div></div> <!-- 占位用 -->

        <!-- 完成弹窗 -->
        <div id="completion-card">
            <h1>🎉 校园巡逻完成！</h1>
            <p>小机器人已成功检查完所有校园区域。</p>
            <button class="btn" onclick="restartPatrol()">再次巡逻</button>
        </div>

        <!-- 底部控制按钮 -->
        <div class="controls">
            <button class="btn" id="btn-start" onclick="startPatrol()">开始巡逻</button>
            <button class="btn btn-secondary" id="btn-pause" onclick="pausePatrol()">暂停</button>
            <button class="btn btn-secondary" onclick="restartPatrol()">重新出发</button>
        </div>
    </div>

    <script>
        // --- 1. 基础场景设置 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#e0f7fa');
        scene.fog = new THREE.FogExp2('#e0f7fa', 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // 限制不能低于地面
        controls.minDistance = 15;
        controls.maxDistance = 80;

        // --- 2. 光照设计（营造柔和暖阳效果）---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
        dirLight.position.set(30, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        const d = 35;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- 3. 材质库（玩具风格高质感）---
        const materials = {
            ground: new THREE.MeshStandardMaterial({ color: 0x91dc5a, roughness: 0.8 }),
            road: new THREE.MeshStandardMaterial({ color: 0xfff9c4, roughness: 0.6 }),
            buildingMain: new THREE.MeshStandardMaterial({ color: 0xffb74d, roughness: 0.4 }),
            buildingRoof: new THREE.MeshStandardMaterial({ color: 0xef5350, roughness: 0.3 }),
            window: new THREE.MeshStandardMaterial({ color: 0x81d4fa, roughness: 0.2 }),
            track: new THREE.MeshStandardMaterial({ color: 0xff8a65, roughness: 0.7 }),
            fieldGrass: new THREE.MeshStandardMaterial({ color: 0xaed581, roughness: 0.9 }),
            treeTrunk: new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.9 }),
            treeFoliage: new THREE.MeshStandardMaterial({ color: 0x66bb6a, roughness: 0.5 }),
            robotBody: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 }),
            robotJoint: new THREE.MeshStandardMaterial({ color: 0x78909c, roughness: 0.3 }),
            robotEye: new THREE.MeshBasicMaterial({ color: 0x29b6f6 }),
            starActive: new THREE.MeshStandardMaterial({ color: 0xffd54f, roughness: 0.2, emissive: 0xffb300, emissiveIntensity: 0.8 }),
            starInactive: new THREE.MeshStandardMaterial({ color: 0xb0bec5, roughness: 0.8, transparent: true, opacity: 0.4 })
        };

        // --- 4. 校园场景搭建 ---
        // 地面
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), materials.ground);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 教学楼
        function createBuilding(x, z) {
            const group = new THREE.Group();
            
            // 主楼
            const body = new THREE.Mesh(new THREE.BoxGeometry(10, 8, 6), materials.buildingMain);
            body.position.y = 4;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // 屋顶
            const roof = new THREE.Mesh(new THREE.ConeGeometry(7.5, 3, 4), materials.buildingRoof);
            roof.position.y = 9.5;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            group.add(roof);

            // 窗户
            for (let i = -3; i <= 3; i += 3) {
                for (let j = 2; j <= 6; j += 3) {
                    const win = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.8), materials.window);
                    win.position.set(i, j, 3.01);
                    group.add(win);
                }
            }
            group.position.set(x, 0, z);
            scene.add(group);
        }
        createBuilding(-18, -15);
        createBuilding(-5, -18);

        // 操场（跑道与草坪）
        function createPlayground(x, z) {
            const group = new THREE.Group();
            // 外圈跑道
            const track = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 0.1, 32), materials.track);
            track.scale.set(1.4, 1, 1);
            track.receiveShadow = true;
            group.add(track);

            // 内圈草坪
            const inner = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 7.5, 0.12, 32), materials.fieldGrass);
            inner.scale.set(1.4, 1, 1);
            inner.receiveShadow = true;
            group.add(inner);

            group.position.set(x, 0.05, z);
            scene.add(group);
        }
        createPlayground(16, 12);

        // 树木生成器（卡哇伊球形树）
        function createTree(x, z, scale = 1) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * scale, 0.4 * scale, 2 * scale, 8), materials.treeTrunk);
            trunk.position.y = 1 * scale;
            trunk.castShadow = true;
            group.add(trunk);

            const foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5 * scale, 1), materials.treeFoliage);
            foliage.position.y = 2.6 * scale;
            foliage.castShadow = true;
            group.add(foliage);

            group.position.set(x, 0, z);
            scene.add(group);
        }

        // 批量种植树木
        const treePositions = [
            [-28, -5], [-26, 8], [-20, 20], [-8, 25], [5, 28],
            [-28, -25], [-12, -28], [28, -20], [30, -5], [32, 22]
        ];
        treePositions.forEach(pos => createTree(pos[0], pos[1], 0.8 + Math.random() * 0.4));

        // --- 5. 创建可爱圆滚滚机器人 ---
        function createRobot() {
            const robot = new THREE.Group();

            // 身体（圆球）
            const body = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32), materials.robotBody);
            body.position.y = 1.6;
            body.scale.set(1, 0.9, 1);
            body.castShadow = true;
            robot.add(body);

            // 头部（稍扁的圆球）
            const headGroup = new THREE.Group();
            headGroup.position.y = 2.6;
            
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), materials.robotBody);
            head.scale.set(1.1, 0.9, 1);
            head.castShadow = true;
            headGroup.add(head);

            // 眼睛 (左右)
            const eyeLeft = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), materials.robotEye);
            eyeLeft.position.set(-0.3, 0.1, 0.7);
            const eyeRight = eyeLeft.clone();
            eyeRight.position.x = 0.3;
            headGroup.add(eyeLeft);
            headGroup.add(eyeRight);

            // 头顶小天线
            const antennaRod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), materials.robotJoint);
            antennaRod.position.y = 0.9;
            headGroup.add(antennaRod);

            const antennaBall = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), materials.starActive);
            antennaBall.position.y = 1.15;
            headGroup.add(antennaBall);

            robot.add(headGroup);

            // 手臂 (左右)
            const armGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const armLeft = new THREE.Mesh(armGeo, materials.robotBody);
            armLeft.position.set(-1.2, 1.6, 0);
            armLeft.scale.set(0.7, 1.2, 0.7);
            const armRight = armLeft.clone();
            armRight.position.x = 1.2;
            robot.add(armLeft);
            robot.add(armRight);

            // 轮子 / 底座
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.4, 32), materials.robotJoint);
            wheel.position.y = 0.3;
            wheel.rotation.x = Math.PI / 2;
            robot.add(wheel);

            robot.headGroup = headGroup;
            robot.armLeft = armLeft;
            robot.armRight = armRight;

            return robot;
        }

        const robot = createRobot();
        scene.add(robot);

        // --- 6. 巡逻路线与彩色检查点 ---
        // 定义关键巡逻点（曲线轨迹）
        const controlPoints = [
            new THREE.Vector3(-18, 0, 5),    // 检查点 1 附近（教学楼前）
            new THREE.Vector3(-10, 0, 18),
            new THREE.Vector3(12, 0, 22),    // 检查点 2 附近（操场侧）
            new THREE.Vector3(20, 0, -8),    // 检查点 3 附近（花园区）
            new THREE.Vector3(0, 0, -10),
            new THREE.Vector3(-18, 0, 5)     // 闭环
        ];

        const patrolCurve = new THREE.CatmullRomCurve3(controlPoints, true);

        // 绘制地面巡逻虚线路径
        const pathPoints = patrolCurve.getPoints(100);
        const pathGeometry = new THREE.BufferGeometry().setFromPoints(pathPoints);
        const pathMaterial = new THREE.LineDashedMaterial({
            color: 0xffffff,
            dashSize: 0.8,
            gapSize: 0.4,
            linewidth: 2
        });
        const pathLine = new THREE.Line(pathGeometry, pathMaterial);
        pathLine.computeLineDistances();
        pathLine.position.y = 0.08;
        scene.add(pathLine);

        // 检查点数据（位置、颜色、打卡状态）
        const checkpointConfigs = [
            { pos: new THREE.Vector3(-18, 0, 5), color: 0xff4081, progressTrigger: 0.0 },  // 玫红
            { pos: new THREE.Vector3(12, 0, 22), color: 0x00e676, progressTrigger: 0.38 }, // 翠绿
            { pos: new THREE.Vector3(20, 0, -8), color: 0x29b6f6, progressTrigger: 0.68 }  // 湛蓝
        ];

        // 创建五角星 Mesh 辅助函数
        function createStarShape() {
            const shape = new THREE.Shape();
            const points = 5;
            const outerRadius = 0.8;
            const innerRadius = 0.4;
            for (let i = 0; i < points * 2; i++) {
                const r = (i % 2 === 0) ? outerRadius : innerRadius;
                const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
                const x = Math.cos(a) * r;
                const y = Math.sin(a) * r;
                if (i === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            }
            const extrudeSettings = { depth: 0.2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
            return new THREE.ExtrudeGeometry(shape, extrudeSettings);
        }

        const starGeometry = createStarShape();
        const checkpoints = [];

        checkpointConfigs.forEach((cfg, idx) => {
            const group = new THREE.Group();
            group.position.copy(cfg.pos);

            // 彩色底座
            const baseMat = new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.4 });
            const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.2, 0.3, 32), baseMat);
            base.position.y = 0.15;
            base.receiveShadow = true;
            group.add(base);

            // 检查点发光光圈
            const ringMat = new THREE.MeshBasicMaterial({ color: cfg.color, transparent: true, opacity: 0.4 });
            const ring = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.6, 32), ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.02;
            group.add(ring);

            // 悬浮星星（初始未激活）
            const star = new THREE.Mesh(starGeometry, materials.starInactive.clone());
            star.position.y = 3;
            star.castShadow = true;
            group.add(star);

            scene.add(group);

            checkpoints.push({
                group: group,
                star: star,
                triggerProgress: cfg.progressTrigger,
                activated: false,
                color: cfg.color
            });
        });

        // --- 7. 巡逻逻辑与动画控制 ---
        let isPatrolling = false;
        let progress = 0; // 0 到 1 的巡逻进度
        const patrolSpeed = 0.0006; // 巡逻速度

        function startPatrol() {
            if (progress >= 1) restartPatrol();
            isPatrolling = true;
            document.getElementById('btn-start').innerText = "巡逻中...";
            document.getElementById('completion-card').classList.remove('show');
        }

        function pausePatrol() {
            isPatrolling = false;
            document.getElementById('btn-start').innerText = "继续巡逻";
        }

        function restartPatrol() {
            isPatrolling = false;
            progress = 0;
            // 重置机器人位置
            const startPoint = patrolCurve.getPointAt(0);
            robot.position.copy(startPoint);
            robot.lookAt(patrolCurve.getPointAt(0.01));
            
            // 重置检查点星星状态
            checkpoints.forEach(cp => {
                cp.activated = false;
                cp.star.material = materials.starInactive.clone();
                cp.star.scale.set(1, 1, 1);
            });

            document.getElementById('btn-start').innerText = "开始巡逻";
            document.getElementById('completion-card').classList.remove('show');
        }

        // 触发展示打卡成功动画
        function activateCheckpoint(cp) {
            cp.activated = true;
            // 切换为亮黄色高光材质
            cp.star.material = materials.starActive;
            
            // 简单弹跳缩放效果
            let scaleVal = 1.5;
            const bounce = () => {
                if (scaleVal > 1) {
                    scaleVal -= 0.02;
                    cp.star.scale.set(scaleVal, scaleVal, scaleVal);
                    requestAnimationFrame(bounce);
                } else {
                    cp.star.scale.set(1, 1, 1);
                }
            };
            bounce();
        }

        // --- 8. 主渲染循环 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 1. 机器人巡逻移动逻辑
            if (isPatrolling) {
                progress += patrolSpeed;

                if (progress >= 1) {
                    progress = 1;
                    isPatrolling = false;
                    document.getElementById('btn-start').innerText = "巡逻完成";
                    document.getElementById('completion-card').classList.add('show');
                }

                // 沿着曲线更新位置
                const currentPos = patrolCurve.getPointAt(progress % 1);
                const nextPos = patrolCurve.getPointAt((progress + 0.001) % 1);
                
                robot.position.copy(currentPos);
                robot.lookAt(nextPos);

                // 机器人摇摆与走动动画
                robot.position.y = Math.abs(Math.sin(time * 10)) * 0.15; // 上下颠簸
                robot.headGroup.rotation.y = Math.sin(time * 3) * 0.2; // 左右看
                robot.armLeft.rotation.x = Math.sin(time * 8) * 0.4; // 甩手
                robot.armRight.rotation.x = -Math.sin(time * 8) * 0.4;

                // 检测是否到达检查点
                checkpoints.forEach(cp => {
                    if (!cp.activated && progress >= cp.triggerProgress) {
                        activateCheckpoint(cp);
                    }
                });
            } else {
                // 待机状态：微弱呼吸效果
                robot.position.y = Math.sin(time * 2) * 0.05;
                robot.headGroup.rotation.y = Math.sin(time * 1) * 0.1;
            }

            // 2. 检查点星星旋转与悬浮
            checkpoints.forEach((cp, index) => {
                if (cp.activated) {
                    cp.star.rotation.y = time * 2.5;
                    cp.star.position.y = 3 + Math.sin(time * 4 + index) * 0.3;
                } else {
                    cp.star.rotation.y = time * 0.5;
                    cp.star.position.y = 3 + Math.sin(time * 1.5 + index) * 0.1;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // 初始化机器人起始位置
        restartPatrol();

        // 开始动画循环
        animate();

        // --- 9. 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

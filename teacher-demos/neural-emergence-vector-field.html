<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神经涌现 · 向量流场</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020205;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 极客风格 UI 控制台 */
        .glass-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 20, 35, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(120, 255, 200, 0.1);
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 10;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #a0aec0;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        button.active {
            color: #fff;
            background: rgba(45, 212, 191, 0.15);
            border-color: #2dd4bf;
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.3);
            text-shadow: 0 0 5px #2dd4bf;
        }

        .hud {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(45, 212, 191, 0.6);
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            line-height: 1.8;
            letter-spacing: 1px;
        }

        .hud span { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="hud">
        MODEL: <span id="mode-text">心流巡航 (FLOW STATE)</span><br>
        VECTORS: <span id="particle-count">3000</span><br>
        [ 长按鼠标注入干预能量 ]
    </div>
    
    <canvas id="canvas"></canvas>

    <div class="glass-panel">
        <button class="active" onclick="setMode('flow', '心流巡航', this)">心流巡航</button>
        <button onclick="setMode('chaos', '混沌演化', this)">混沌演化</button>
        <button onclick="setMode('matrix', '矩阵重构', this)">矩阵重构</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const modeText = document.getElementById('mode-text');

        let width, height;
        let particles = [];
        const PARTICLE_COUNT = 3000;
        
        let time = 0;
        let mode = 'flow'; // flow, chaos, matrix
        let mouse = { x: -1000, y: -1000, isDown: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // 每次调整窗口大小时重新铺满粒子
            initParticles();
        }
        window.addEventListener('resize', resize);

        // 核心数学引擎：向量场角度计算
        function getFieldAngle(x, y) {
            let angle = 0;
            // 将坐标缩放以适应噪声频率
            let nx = x * 0.003;
            let ny = y * 0.003;

            if (mode === 'flow') {
                // 顺滑的三角函数叠加，形成有规律的心流场
                angle = Math.sin(nx + time) * Math.cos(ny + time) * Math.PI * 2;
            } else if (mode === 'chaos') {
                // 更高频率的多重叠加，产生湍流和漩涡
                angle = (Math.sin(nx * 2 + time * 1.5) + Math.cos(ny * 3 - time)) * Math.PI * 1.5;
            } else if (mode === 'matrix') {
                // 将角度强制吸附到 45 度（PI/4）的倍数，形成科技感的网格折线
                let rawAngle = Math.sin(nx + time) * Math.cos(ny + time) * Math.PI * 2;
                angle = Math.round(rawAngle / (Math.PI / 4)) * (Math.PI / 4);
            }
            return angle;
        }

        // 切换模式
        function setMode(newMode, name, btn) {
            mode = newMode;
            modeText.innerText = name + ' (' + newMode.toUpperCase() + ')';
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // 切换模式时给所有粒子施加随机扰动，增加过渡的动感
            particles.forEach(p => {
                p.vx += (Math.random() - 0.5) * 5;
                p.vy += (Math.random() - 0.5) * 5;
            });
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(randomPos = false) {
                // 可以全屏随机生成，也可以从边缘生成
                this.x = randomPos ? Math.random() * width : Math.random() * width;
                this.y = randomPos ? Math.random() * height : Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                // 粒子的基础巡航速度
                this.speed = Math.random() * 1.5 + 1; 
            }

            update() {
                // 获取当前所在位置的向量场角度
                let angle = getFieldAngle(this.x, this.y);
                
                // 鼠标交互干预（扰动场）
                if (mouse.isDown) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    // 如果在鼠标引力范围内
                    if (dist < 200) {
                        let forceAngle = Math.atan2(dy, dx);
                        // 线性插值，让粒子逐渐偏向鼠标中心
                        angle += (forceAngle - angle) * (1 - dist / 200) * 2;
                    }
                }

                // 目标速度向量
                let targetVx = Math.cos(angle) * this.speed;
                let targetVy = Math.sin(angle) * this.speed;

                // 平滑插值更新当前速度（惯性体现）
                this.vx += (targetVx - this.vx) * 0.1;
                this.vy += (targetVy - this.vy) * 0.1;

                // 记录上一帧坐标，用于连线绘制
                this.px = this.x;
                this.py = this.y;

                this.x += this.vx;
                this.y += this.vy;

                // 无缝边缘环绕 (Wrap around)
                if (this.x < 0) { this.x = width; this.px = width; }
                if (this.x > width) { this.x = 0; this.px = 0; }
                if (this.y < 0) { this.y = height; this.py = height; }
                if (this.y > height) { this.y = 0; this.py = 0; }
            }

            draw() {
                // 根据粒子的横坐标和当前时间动态计算颜色
                let hue = (this.x / width) * 60 + 160 + time * 20; // 从青色(160)向蓝色过渡
                
                if (mode === 'chaos') hue += 150; // 混沌模式偏红紫
                if (mode === 'matrix') hue = 120; // 矩阵模式纯粹的黑客绿

                // 绘制极细的光流线
                ctx.beginPath();
                ctx.moveTo(this.px, this.py);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.4)`;
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // 极低透明度的黑色填充，用于产生“长曝光”的视觉拖尾效果
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(2, 2, 5, 0.06)';
            ctx.fillRect(0, 0, width, height);

            // 切换混合模式为 lighter，让密集的线条产生发光叠加
            ctx.globalCompositeOperation = 'lighter';

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            time += 0.005; // 推动时间引擎
            requestAnimationFrame(animate);
        }

        // 交互控制
        window.addEventListener('mousedown', (e) => {
            mouse.isDown = true;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseup', () => mouse.isDown = false);
        window.addEventListener('mousemove', (e) => {
            if (mouse.isDown) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            }
        });

        // 触控支持
        window.addEventListener('touchstart', (e) => {
            mouse.isDown = true;
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, {passive: true});
        window.addEventListener('touchend', () => mouse.isDown = false);
        window.addEventListener('touchmove', (e) => {
            if (mouse.isDown) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, {passive: true});

        // 启动系统
        resize();
        animate();
    </script>
</body>
</html>

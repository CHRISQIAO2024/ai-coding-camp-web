            ];

            let bubbles = [], score = 0, pointer = 0;
            function shuffle(arr) { arr.sort(() => Math.random() - 0.5); }
            shuffle(wordDatabase);

            class Bubble {
                constructor(word) {
                    this.x = Math.random() * (window.innerWidth - 100) + 50;
                    this.y = -50; this.vy = Math.random() * 2 + 1;
                    this.en = word.en; this.cn = word.cn; this.radius = 50;
                }
                update() { this.y += this.vy; }
                draw() {
                    ctx.fillStyle = '#3b82f6'; ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '16px Arial'; ctx.fillText(this.en, this.x, this.y + 5);
                }
            }

            class FloatingText {
                constructor(x, y, text) { this.x = x; this.y = y; this.text = text; this.alpha = 1; }
                update() { this.y -= 1; this.alpha -= 0.01; }
                draw() { ctx.globalAlpha = this.alpha; ctx.fillStyle = '#fbbf24'; ctx.font = '24px Arial'; ctx.fillText(this.text, this.x, this.y); ctx.globalAlpha = 1; }
            }

            let floatingTexts = [];
            canvas.addEventListener('mousedown', (e) => {
                bubbles.forEach((b, i) => {
                    if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.radius) {
                        const utter = new SpeechSynthesisUtterance(b.en);
                        window.speechSynthesis.speak(utter);
                        floatingTexts.push(new FloatingText(b.x, b.y, b.cn));
                        bubbles.splice(i, 1); score++; scoreEl.innerText = score;
                    }
                });
            });

            btn.addEventListener('click', () => {
                for(let i=0; i<3; i++) {
                    if(pointer < wordDatabase.length) bubbles.push(new Bubble(wordDatabase[pointer++]));
                }
            });

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                bubbles.forEach(b => { b.update(); b.draw(); });
                floatingTexts.forEach((ft, i) => { ft.update(); ft.draw(); if(ft.alpha <= 0) floatingTexts.splice(i, 1); });
                requestAnimationFrame(animate);
            }
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            animate();
        });

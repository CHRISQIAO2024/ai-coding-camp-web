<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开普勒第二定律 | 经典物理实验</title>
  <meta name='description' content='用行星椭圆轨道与等面积扇形观察面积速度定律。'>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .stage { width: min(100%, 1440px); margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
    footer { padding: 12px 20px 20px; color: #475569; font-size: 13px; text-align: center; line-height: 1.7; }
    footer a { color: #0369a1; }
    .model-note { max-width: 900px; margin: 0 auto; padding: 0 20px 8px; }
  </style>
</head>
<body>
<main class="stage">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
  </defs>

  <g transform="translate(30, 42)">
    <text x="0" y="0" font-size="22" font-weight="bold" fill="#0f172a">🪐 行星公转与等面积切披萨 —— 开普勒第二定律的秘密</text>
    <text x="0" y="24" font-size="13" fill="#64748b">离太阳近时飞奔如风，离太阳远时慢条斯理；但在相等的时间里，它们扫过的轨道面积永远分毫不差！</text>
  </g>

  <!-- 左侧卡片：轨道实景动画 -->
  <rect x="25" y="85" width="450" height="360" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="45" y="118" font-size="15" font-weight="bold" fill="#ea580c">1. 椭圆轨道上的变速飞行（动态扫掠）</text>
  <text x="45" y="136" font-size="11.5" fill="#64748b">太阳位于椭圆的一个焦点上，行星在近日点极快、远日点极慢</text>

  <!-- 右侧卡片：等面积披萨对比 -->
  <rect x="495" y="85" width="380" height="360" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="515" y="118" font-size="15" font-weight="bold" fill="#0284c7">2. “短胖披萨” 与 “长瘦披萨”（面积恒等）</text>
  <text x="515" y="136" font-size="11.5" fill="#64748b">相同时间内，扫过的两块扇形披萨面积严格相等！</text>

  <!-- 左侧图形区域：椭圆中心 (260, 270), a=130, b=95, c=88.7 (焦点在 171.3) -->
  <g id="orbit-stage">
    <!-- 椭圆轨道 -->
    <ellipse cx="260" cy="270" rx="130" ry="95" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="4,4"/>

    <!-- 太阳与行星当前实时连线光束 -->
    <line id="sun-planet-line" x1="171.3" y1="270" x2="390" y2="270" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- 动态扫掠的扇形披萨 -->
    <path id="sweep-sector" d="" fill="#fed7aa" opacity="0.6"/>

    <!-- 太阳 (焦点 171.3, 270) -->
    <circle cx="171.3" cy="270" r="16" fill="url(#sun-glow)" filter="url(#soft-shadow)"/>
    <text x="171.3" y="274" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">日</text>
    <text x="171.3" y="298" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="bold">太阳 (焦点)</text>

    <!-- 近日点与远日点标记 -->
    <text x="110" y="265" font-size="10" fill="#dc2626" font-weight="bold">近日点(超快!)</text>
    <text x="375" y="265" font-size="10" fill="#0284c7" font-weight="bold">远日点(慢悠悠)</text>

    <!-- 行星地球 -->
    <g id="planet-earth" transform="translate(390, 270)">
      <circle cx="0" cy="0" r="8.5" fill="#0284c7" stroke="#ffffff" stroke-width="2" filter="url(#soft-shadow)"/>
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
    </g>

    <!-- 速度矢量箭头 -->
    <line id="velocity-arrow" x1="390" y1="270" x2="390" y2="240" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 左侧状态看板 -->
    <rect x="45" y="380" width="410" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text id="label-kepler-status" x="58" y="400" font-size="12" font-weight="bold" fill="#c2410c">当前位置: 近日点冲刺中</text>
    <text id="label-kepler-desc" x="58" y="418" font-size="10.5" fill="#ea580c">离太阳越近引力越强，速度飙升；离太阳越远，速度放缓</text>
  </g>

  <!-- 右侧图形区域：两块等面积扇形披萨剖析 -->
  <g id="pizza-analysis" transform="translate(515, 160)">
    <!-- 示意图：短胖披萨 (近日点) -->
    <g transform="translate(45, 60)">
      <path d="M 0 0 L -30 25 A 38 38 0 0 0 -30 -25 Z" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#ea580c"/>
      <text x="-45" y="45" font-size="11" font-weight="bold" fill="#dc2626">🍕 披萨 A (近日点)</text>
      <text x="-45" y="62" font-size="9.5" fill="#64748b">短粗胖：半径小，但跑得快角速度大</text>
      <text x="-45" y="78" font-size="10.5" font-weight="bold" fill="#dc2626">面积 = 100%</text>
    </g>

    <!-- 等号连接 -->
    <text x="175" y="68" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">=</text>

    <!-- 示意图：细长披萨 (远日点) -->
    <g transform="translate(260, 60)">
      <path d="M 0 0 L 70 8 A 72 72 0 0 0 70 -8 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#ea580c"/>
      <text x="35" y="45" font-size="10" font-weight="bold" fill="#0284c7">B · 远日点</text>
      <text x="35" y="62" font-size="8.5" fill="#64748b">半径较长，扫过角较小</text>
      <text x="35" y="78" font-size="10.5" font-weight="bold" fill="#0284c7">面积 = 100%</text>
    </g>

    <!-- 总结对比框 -->
    <rect x="0" y="145" width="340" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="15" y="168" font-size="11.5" font-weight="bold" fill="#0f172a">⚖️ 开普勒等面积公式：dA / dt = 常数</text>
    <text x="15" y="188" font-size="10" fill="#64748b">“胖短块”和“细长条”切下来的披萨大小分毫不差！</text>
  </g>

  <!-- 右侧底部看板 -->
  <rect x="515" y="380" width="340" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="528" y="400" font-size="12" font-weight="bold" fill="#15803d">物理底蕴：角动量守恒定律</text>
  <text x="528" y="418" font-size="10.5" fill="#16a34a">就像滑冰运动员收拢双臂转速飞快，张开双臂转速变慢！</text>

  <!-- 底部生动口诀与趣味说明 -->
  <g transform="translate(30, 462)">
    <rect x="-5" y="-12" width="850" height="34" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="15" y="10" font-size="12.5" fill="#9a3412">
      💡 <tspan font-weight="bold" fill="#c2410c">一句话秒懂：</tspan>
      近处快快飞，远处慢条斯理跑！<tspan font-weight="bold">短胖披萨等于长瘦披萨</tspan>，相同时间扫过面积永远一样大，这就是<tspan fill="#ea580c" font-weight="bold">开普勒第二定律</tspan>！
    </text>
  </g>

  <script type="text/javascript">
    <![CDATA[
    (function() {
      const cx = 260, cy = 270;
      const a = 130, b = 95;
      const c = Math.sqrt(a * a - b * b); // 约 88.74
      const sunX = cx - c; // 171.26
      const sunY = cy;

      const planet = document.getElementById('planet-earth');
      const sunLine = document.getElementById('sun-planet-line');
      const velocityArrow = document.getElementById('velocity-arrow');
      const sweepSector = document.getElementById('sweep-sector');
      const labelStatus = document.getElementById('label-kepler-status');
      const labelDesc = document.getElementById('label-kepler-desc');

      const cycleDuration = 6000;
      let startTime = null;

      function update(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const M = ((elapsed % cycleDuration) / cycleDuration) * 2 * Math.PI;

        // 开普勒方程数值解: M = E - e*sin(E)
        const e = c / a; // 约 0.68
        let E = M;
        for (let i = 0; i < 5; i++) {
          E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
        }

        // 椭圆坐标:
        const x = cx + a * Math.cos(E);
        const y = cy - b * Math.sin(E);

        planet.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
        sunLine.setAttribute('x2', x.toFixed(1));
        sunLine.setAttribute('y2', y.toFixed(1));

        // 速度矢量切线: dx/dE = -a*sin(E), dy/dE = -b*cos(E)
        const speedScale = 25 / (1 - e * Math.cos(E)); // 近日点速度大
        const vx = -Math.sin(E) * speedScale;
        const vy = -Math.cos(E) * speedScale;
        velocityArrow.setAttribute('x1', x.toFixed(1));
        velocityArrow.setAttribute('y1', y.toFixed(1));
        velocityArrow.setAttribute('x2', (x + vx).toFixed(1));
        velocityArrow.setAttribute('y2', (y + vy).toFixed(1));

        // 动态绘制一段等时扫掠扇区
        const deltaM = Math.PI / 6; // 固定 30度 的等时间隔
        let dSector = 'M ' + sunX.toFixed(1) + ' ' + sunY.toFixed(1);
        for (let s = 0; s <= 10; s++) {
          let sE = (M - deltaM * (1 - s / 10));
          for (let k = 0; k < 3; k++) {
            sE = sE - (sE - e * Math.sin(sE) - (M - deltaM * (1 - s / 10))) / (1 - e * Math.cos(sE));
          }
          const sx = cx + a * Math.cos(sE);
          const sy = cy - b * Math.sin(sE);
          dSector += ' L ' + sx.toFixed(1) + ' ' + sy.toFixed(1);
        }
        dSector += ' Z';
        sweepSector.setAttribute('d', dSector);

        // 状态文案
        const distToSun = Math.hypot(x - sunX, y - sunY);
        if (distToSun < a * (1 - e) + 20) {
          labelStatus.textContent = '⚡ 飞越近日点！引力最大，速度狂飙！';
          labelDesc.textContent = '短时间内转过很大角度，扇区又胖又短';
        } else if (distToSun > a * (1 + e) - 20) {
          labelStatus.textContent = '❄️ 漫游远日点！引力减弱，慢条斯理爬行';
          labelDesc.textContent = '虽然速度慢转角小，但半径很长，面积同样恒等';
        } else {
          labelStatus.textContent = '🪐 轨道正常公转中 | 太阳距离: ' + distToSun.toFixed(0) + ' px';
          labelDesc.textContent = '相同时间切出的“披萨面积”恒定不变 (dA/dt = 常数)';
        }

        requestAnimationFrame(update);
      }

      requestAnimationFrame(update);
    })();
    ]]>
  </script>
</svg>
</main>
 <footer><p class='model-note'>以理想两体引力模型说明开普勒第二定律；实际天体还会受到其他天体摄动。</p><a href='../../gallery/#physics'>返回经典物理实验系列</a> · 教师演示整理：乔瑞 · AI 辅助制作</footer>
</body>
</html>
